apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nginx-dev
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-sources
  interval: 5m
  path: ./fleet-infra/apps/development/nginx
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
