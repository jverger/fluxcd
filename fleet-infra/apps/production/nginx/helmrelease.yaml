apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx
  namespace: web
spec:
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: nginx
      version: "18.2.4"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    replicaCount: 3
    image:
      registry: docker.io
      repository: bitnami/nginx
      tag: latest
  valuesFrom:
    - kind: ConfigMap
      name: nginx-prod-values
      valuesKey: values.yaml
    - kind: Secret
      name: nginx-prod-secrets
      valuesKey: secrets.yaml
      optional: true
