apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx
  namespace: web
spec:
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: nginx
      version: ">=18.0.0 <19.0.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    replicaCount: 3
    image:
      registry: docker.io
      repository: library/nginx
      tag: latest
    containerPorts:
      http: 80
  valuesFrom:
    - kind: ConfigMap
      name: nginx-prod-values
      valuesKey: values.yaml
    - kind: Secret
      name: nginx-prod-secrets
      valuesKey: secrets.yaml
      optional: true
