apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ../../base/nginx
nameSuffix: "-dev"
namespace: web-dev
patches:
  - target:
      kind: HelmRelease
      name: nginx
    patch: |
      - op: replace
        path: /spec/values/replicaCount
        value: 1
